name: Generar APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [app.js, index.html, xlsx.js, sw.js, manifest.webmanifest, banner.svg, fonts/**, icon-*.png, capacitor.config.json, package.json, .github/workflows/apk.yml]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Preparar web
        run: |
          mkdir www
          cp index.html app.js xlsx.js sw.js manifest.webmanifest banner.svg icon-192.png icon-512.png www/
          cp -r fonts www/
      - name: Instalar Capacitor y crear proyecto Android
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: Permisos de ubicación e icono
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n</manifest>#' $M
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          pip install pillow
          python3 - <<'PY'
          from PIL import Image
          import os, shutil
          R = "android/app/src/main/res"
          im = Image.open("icon-512.png").convert("RGBA")
          for n, sz in {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}.items():
              d = f"{R}/mipmap-{n}"
              im.resize((sz, sz), Image.LANCZOS).save(f"{d}/ic_launcher.png")
              shutil.copy(f"{d}/ic_launcher.png", f"{d}/ic_launcher_round.png")
              fg = f"{d}/ic_launcher_foreground.png"
              if os.path.exists(fg): os.remove(fg)
          PY
      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Publicar APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk GS-VCT.apk
          gh release delete apk-latest -y --cleanup-tag || true
          gh release create apk-latest GS-VCT.apk --title "GS VCT (APK)" --notes "Descarga GS-VCT.apk e instálala en el celular. Generada del commit ${GITHUB_SHA::7}."
      - uses: actions/upload-artifact@v4
        with:
          name: GS-VCT-apk
          path: GS-VCT.apk
