<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FF6600">
<title>GS VCT · Vínculo Cliente – Transformador</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#F5F6F8;--card:#FFFFFF;--tx:#18202A;--mut:#68737F;--line:#E7EAEE;--pri:#FF6600;--pri-d:#E55A00;--pri-soft:#FFF1E7;--sec:#C1C7CE;--ter:#79D1FF;--ok:#12874e;--bad:#cf3128;--new:#0b78b8;--warn:#b45f06;--inp:#FBFCFD;--shadow:0 1px 2px rgba(20,30,45,.05),0 6px 20px rgba(20,30,45,.05)}
@media(prefers-color-scheme:dark){:root{--bg:#0F1318;--card:#171D24;--tx:#EEF1F4;--mut:#98A3AF;--line:#26303A;--pri-soft:rgba(255,102,0,.15);--sec:#46505a;--ok:#3ccf86;--bad:#ff6b62;--new:#6cc6f5;--warn:#f0a548;--inp:#11161B;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss03";letter-spacing:-.003em;line-height:1.4}
#root{max-width:760px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
header{position:sticky;top:0;z-index:20;background:var(--card);color:var(--tx);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px}
header h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.02em}
header small{display:block;color:var(--mut);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}header .brand>div{min-width:0}
header .prog{background:var(--pri-soft);color:var(--pri);border-radius:99px;padding:4px 11px;font-weight:600;font-size:13px}
.ib{background:var(--bg);border:0;color:var(--tx);border-radius:12px;width:40px;height:40px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
main{flex:1;padding:16px;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;max-width:760px;margin:0 auto;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav.bottom button{flex:1;border:0;background:none;color:var(--mut);padding:6px 2px;font:inherit;font-size:11.5px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:12px}
nav.bottom button.on{color:var(--pri);background:var(--pri-soft)}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);border:1px solid var(--line);padding:16px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 12px;font-weight:600;color:var(--tx)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid rgba(24,32,42,.12);background:rgba(24,32,42,.035);color:var(--tx);border-radius:12px;padding:11px 16px;font:inherit;font-weight:600;cursor:pointer;min-height:46px;transition:background .18s,border-color .18s,transform .1s}
.btn:active{transform:scale(.985);background:rgba(24,32,42,.07)}
.btn.pri{background:rgba(255,102,0,.12);border-color:rgba(255,102,0,.38);color:#B34700}
.btn.pri:active{background:rgba(255,102,0,.22)}
.btn.ter{background:rgba(121,209,255,.18);border-color:rgba(60,150,200,.35);color:#0b5f8f}
@media(prefers-color-scheme:dark){.btn{border-color:rgba(255,255,255,.14);background:rgba(255,255,255,.05)}.btn:active{background:rgba(255,255,255,.1)}.btn.pri{background:rgba(255,102,0,.2);border-color:rgba(255,140,60,.5);color:#FFAE75}.btn.ter{color:#9fdcff;border-color:rgba(121,209,255,.4)}}
.btn.bad{color:var(--bad)}.btn.full{width:100%}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{padding:6px 12px;min-height:36px;font-size:13px;border-radius:10px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row>*{flex:1}
.fld{margin-bottom:14px}.fld>label{display:block;font-weight:600;font-size:13px;margin-bottom:6px;color:var(--mut)}
.fld small{display:block;color:var(--mut);margin-top:4px;font-size:12px}.req::after{content:" *";color:var(--pri)}
input[type=text],input[type=number],input[type=search],input[type=tel],select,textarea{width:100%;border:1px solid var(--line);background:var(--inp);color:var(--tx);border-radius:12px;padding:12px 14px;font:inherit;min-height:46px}
textarea{min-height:88px;resize:vertical;text-transform:uppercase}
main.enter{animation:enter .34s cubic-bezier(.2,.7,.2,1)}
@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){main.enter{animation:none}}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ter);box-shadow:0 0 0 3px rgba(121,209,255,.32)}
input[readonly]{color:var(--mut)}
.seg{display:flex;gap:8px}
.seg button{flex:1;border:1px solid var(--line);background:var(--inp);color:var(--tx);border-radius:12px;padding:11px 8px;font:inherit;font-weight:600;font-size:13.5px;cursor:pointer}
.seg button.on{background:var(--pri-soft);border-color:var(--pri);color:var(--pri)}
.seg button.on.no{background:rgba(207,49,40,.09);border-color:var(--bad);color:var(--bad)}
.badge{display:inline-block;border-radius:99px;padding:3px 11px;font-size:12px;font-weight:600;background:var(--line);color:var(--mut)}
.badge.ok{background:rgba(18,135,78,.12);color:var(--ok)}.badge.bad{background:rgba(207,49,40,.11);color:var(--bad)}.badge.new{background:rgba(11,120,184,.12);color:var(--new)}.badge.none{background:var(--line);color:var(--mut)}.badge.pend{background:var(--line);color:var(--mut)}.badge.unc{background:var(--pri-soft);color:var(--pri)}
.note{border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px;background:rgba(121,209,255,.16)}
.note.warn{background:rgba(240,165,72,.15);color:var(--tx)}.note.err{background:rgba(207,49,40,.1);color:var(--bad)}.note.okk{background:rgba(18,135,78,.09)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:99px;padding:7px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.chip.on{background:var(--pri-soft);border-color:var(--pri);color:var(--pri)}
.it{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:10px;font:inherit;color:var(--tx);cursor:pointer;box-shadow:var(--shadow)}
.it .t{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:600}.it .s{color:var(--mut);font-size:12.5px;margin-top:3px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.kpi{background:var(--bg);border-radius:14px;padding:10px 6px;text-align:center}
.kpi b{display:block;font-size:22px;font-weight:600}.kpi span{font-size:11px;color:var(--mut);font-weight:600}
table.tb{width:100%;border-collapse:collapse;font-size:13px}table.tb th,table.tb td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right}table.tb th:first-child,table.tb td:first-child{text-align:left}table.tb th{color:var(--mut);font-size:12px;font-weight:600}
.geo{background:var(--bg);border-radius:14px;padding:12px}.geo .g{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin:2px 0 12px;font-size:12.5px;color:var(--mut)}.geo .g b{display:block;font-size:15px;color:var(--tx);font-variant-numeric:tabular-nums}
.p-good{color:var(--ok)!important}.p-mid{color:var(--warn)!important}.p-bad{color:var(--bad)!important}
.hidden{display:none!important}
#map{width:100%;height:calc(100dvh - 270px);min-height:300px;background:var(--card);border:1px solid var(--line);border-radius:18px;touch-action:none;display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:10px 2px}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.mapbtns{display:flex;gap:8px;margin-top:10px}.mapbtns .btn{flex:1}
.foot{text-align:center;color:var(--mut);font-size:11.5px;margin:18px 0 4px}
.hero{position:relative;border-radius:20px;overflow:hidden;margin-bottom:14px;box-shadow:var(--shadow);background:#CFEBFB}.hero img{display:block;width:100%;height:auto}.hero .ttl{position:absolute;left:5%;top:9%;color:#1d2a35;max-width:48%}.hero .ttl b{display:block;font-weight:600;letter-spacing:-.01em;font-size:clamp(13px,4vw,26px);line-height:1.15}
.modal{position:fixed;inset:0;background:rgba(10,15,20,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal .box{background:var(--card);width:100%;max-width:760px;border-radius:22px 22px 0 0;padding:18px;max-height:86dvh;overflow:auto}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1d242c;color:#fff;border-radius:99px;padding:10px 18px;font-size:14px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:.96}
.mic{width:48px;flex:0 0 48px;padding:0}.mic.rec{background:var(--bad);border-color:var(--bad);color:#fff}
h3{margin:6px 0 10px;font-size:15px}p{margin:6px 0}

@font-face{font-family:Inter;font-weight:400;font-style:normal;font-display:swap;src:url(fonts/Inter-Regular.woff) format("woff")}
@font-face{font-family:Inter;font-weight:500;font-style:normal;font-display:swap;src:url(fonts/Inter-Medium.woff) format("woff")}
@font-face{font-family:Inter;font-weight:600;font-style:normal;font-display:swap;src:url(fonts/Inter-SemiBold.woff) format("woff")}
@font-face{font-family:Inter;font-weight:700;font-style:normal;font-display:swap;src:url(fonts/Inter-Bold.woff) format("woff")}
.btn{background:linear-gradient(180deg,#fff,#eef2f6);border:1px solid rgba(24,32,42,.16);box-shadow:0 1px 2px rgba(24,32,42,.08),inset 0 1px 0 #fff;color:#1d2a35;font-weight:600;letter-spacing:.005em}
.btn:active{background:linear-gradient(180deg,#e9eef3,#e2e8ee);box-shadow:none}
.btn.pri{background:linear-gradient(135deg,#ff8a2b,#ff5f00);border-color:#e85a00;color:#fff;box-shadow:0 4px 12px rgba(255,102,0,.3),inset 0 1px 0 rgba(255,255,255,.3);text-shadow:0 1px 0 rgba(0,0,0,.12)}
.btn.pri:active{background:linear-gradient(135deg,#f07a1a,#e65500);box-shadow:none}
.btn.ter{background:linear-gradient(135deg,#e3f4ff,#c9e8fb);border-color:rgba(40,135,190,.45);color:#075e91;box-shadow:0 3px 9px rgba(40,135,190,.18),inset 0 1px 0 rgba(255,255,255,.6)}
.btn.ter:active{background:#bfe0f5;box-shadow:none}
.btn.bad{background:linear-gradient(180deg,#fff,#fdeceb);border-color:rgba(200,60,50,.35)}
.btn:disabled{box-shadow:none;filter:saturate(.5)}
@media(prefers-color-scheme:dark){.btn{background:linear-gradient(180deg,#27313b,#202830);border-color:rgba(255,255,255,.14);color:#EEF1F4;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}.btn.pri{color:#fff}.btn.ter{background:linear-gradient(135deg,#17384f,#12304a);color:#a8dcf7;border-color:rgba(100,180,230,.4)}.btn.bad{background:#2a1f20}}
.gcard{border:1px solid var(--line);border-radius:16px;background:var(--card);overflow:hidden;margin-bottom:12px}
.ghead{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.gpin{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(121,209,255,.22);color:#0b6aa5;flex:none}.gpin .ic{width:22px;height:22px}
.gcopy{min-width:0;flex:1}.gcopy b{display:block;font-size:14.5px;font-weight:600}.gcopy small{display:block;color:var(--mut);font-size:12px;margin-top:2px}
.gbadge{border-radius:99px;padding:4px 10px;font-size:11px;font-weight:700;background:var(--line);color:var(--mut);flex:none}.gbadge.ok{background:rgba(60,207,134,.18);color:#14733f}.gbadge.mid{background:rgba(240,165,72,.2);color:#9a5a00}.gbadge.warn{background:rgba(255,102,0,.15);color:#b34700}
.gmap{height:96px;display:grid;place-items:center;background:radial-gradient(circle,rgba(121,209,255,.2),transparent 70%),repeating-linear-gradient(0deg,transparent 0 19px,rgba(120,140,160,.12) 19px 20px),repeating-linear-gradient(90deg,transparent 0 19px,rgba(120,140,160,.12) 19px 20px)}
.gring{border-radius:50%;border:2px solid #1f9bd8;background:rgba(31,155,216,.16);display:grid;place-items:center;transition:all .3s}.gring.mid{border-color:#e08a1e;background:rgba(240,165,72,.18)}.gring i{width:10px;height:10px;border-radius:50%;background:#ff6600;box-shadow:0 0 0 3px #fff}.gring.pulse{animation:gp 1.2s ease-in-out infinite}@keyframes gp{50%{transform:scale(1.15);opacity:.7}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
nav.bottom button{font-size:11px}
.lect{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:8px;padding:11px 14px;border-radius:14px;background:rgba(121,209,255,.16);border:1px solid rgba(60,150,200,.28);font-size:14px}
.lect span{display:flex;flex-direction:column;gap:1px;color:var(--mut);font-size:12.5px}.lect span b{color:var(--tx);font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}.lect span em{font-style:normal;font-size:12px}
.lect strong{color:var(--bad);font-size:14px;font-weight:700}.lect.bad{background:rgba(255,80,70,.10);border-color:rgba(220,60,50,.4)}
.kpis.k2{grid-template-columns:repeat(2,1fr)}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast"></div>
<script src="xlsx.js"></script>
<script src="app.js"></script>
</body>
</html>
